name: Weekly MongoDB Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: brianlund/setup-mongodb-database-tools@v1
        with:
          version: "100.20.1"

      - name: Dump and Compress MongoDB
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mongodump --uri="$MONGO_URL" --archive=backup-$DATE.gz --gzip
          echo "BACKUP_FILE=backup-$DATE.gz" >> $GITHUB_ENV

      - name: Upload Backup to Private Supabase Bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -f -X POST "$SUPABASE_URL/storage/v1/object/db-backups/$BACKUP_FILE" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$BACKUP_FILE"
